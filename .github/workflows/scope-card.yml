name: Recorded scope card safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  card:
    name: Read-only register card
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Syntax and complete JavaScript coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/scope-card
          node --version
          node --check powerplatform/src/app/credentialing-register/scope-card.js
          node --check powerplatform/src/app/credentialing-register/preview.js
          node --check powerplatform/src/app/credentialing-register/form-binding.js
          node --test --test-reporter=tap --experimental-test-coverage --test-coverage-include='powerplatform/src/app/credentialing-register/*.js' --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 tests/scope_card/*.test.cjs | tee artifacts/scope-card/node-tests.txt
          grep -q '^# tests 44$' artifacts/scope-card/node-tests.txt
          grep -q '^# pass 44$' artifacts/scope-card/node-tests.txt
          grep -q '^# skipped 0$' artifacts/scope-card/node-tests.txt
          grep -Eq 'form-binding.js[[:space:]]+[|][[:space:]]+100.00[[:space:]]+[|][[:space:]]+100.00[[:space:]]+[|][[:space:]]+100.00' artifacts/scope-card/node-tests.txt
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Create and verify the repository-local Python environment
        shell: pwsh
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          $environment = Join-Path $env:GITHUB_WORKSPACE '.local/decisions-ci'
          try { $existing = Get-Item -LiteralPath $environment -Force -ErrorAction Stop }
          catch [System.Management.Automation.ItemNotFoundException] { $existing = $null }
          if ($null -ne $existing) { throw 'Refusing a pre-existing helper environment.' }
          & $env:SELECTED_PYTHON -I -m venv $environment
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the isolated helper environment.' }
          $executable = Join-Path $environment $(if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' })
          @'
          import os, pathlib, platform, sys, sysconfig
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.local/decisions-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 interpreter.')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(sysconfig.get_path('scripts') + '\n')
          print('Verified repository-local Python', platform.python_version())
          '@ | & $executable -I -
          if ($LASTEXITCODE -ne 0) { throw 'Isolated helper runtime verification failed.' }
      - name: Install pinned test-only browser tools
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r tests/scope_card/browser-requirements.lock
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Synthetic browser, keyboard and narrow-screen smoke
        run: python tests/scope_card/browser_smoke.py
      - name: Real browser composition of form binding and iframe card
        run: python tests/scope_card/form_browser_smoke.py
      - name: Retain actual evidence and source-only preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recorded-scope-card-qualification
          path: |
            artifacts/scope-card/
            synthetic-register-preview.png
            browser-smoke-receipt.json
            powerplatform/src/app/credentialing-register/
          if-no-files-found: error
          retention-days: 14
