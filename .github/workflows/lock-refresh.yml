name: Test locks and development canaries
on:
  schedule:
    - cron: '43 5 * * 2'
  workflow_dispatch:
    inputs:
      preview:
        type: boolean
        default: false
  pull_request:
    paths:
      - 'requirements-ci.*'
      - 'tests/scope_card/browser-requirements.*'
      - '.github/workflows/lock-refresh.yml'
      - 'renovate.json'
      - 'tests/reference/test_lock_pairing.py'
permissions:
  contents: read
concurrency:
  group: test-locks-${{ github.ref }}-${{ github.event_name == 'schedule' || inputs.preview || false }}
  cancel-in-progress: true
jobs:
  qualify:
    name: Resolve and qualify test dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ (github.event_name == 'schedule' || inputs.preview) && '3.15.1' || '3.15.1' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Resolve exact hashed candidates without promotion
        id: resolve
        env:
          PREVIEW: ${{ (github.event_name == 'schedule' || inputs.preview) && 'true' || 'false' }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          root = Path('.local/test-locks'); root.mkdir(parents=True, exist_ok=True)
          preview = os.environ['PREVIEW'] == 'true'
          outputs = {}
          for key, declaration, lock in [('CI_LOCK', 'requirements-ci.txt', 'requirements-ci.lock'), ('BROWSER_LOCK', 'tests/scope_card/browser-requirements.txt', 'tests/scope_card/browser-requirements.lock')]:
              source = Path(declaration)
              if preview:
                  lines = [line.strip() for line in source.read_text().splitlines() if line.strip() and not line.startswith('#')]
                  if not all(re.fullmatch(r'[A-Za-z0-9_.-]+==[^ ]+', line) for line in lines):
                      raise ValueError('Preview discovery requires exact input package declarations.')
                  source = root / (key + '.in'); source.write_text('\n'.join(line.split('==')[0] for line in lines) + '\n')
                  lock = str(root / (key + '.lock'))
              args = ['uv', 'pip', 'compile', str(source), '--generate-hashes', '--universal', '--python-version=3.15.1', f'--output-file={lock}']
              if preview: args += ['--upgrade', '--prerelease', 'allow']
              subprocess.run(args, check=True, stdout=subprocess.DEVNULL)
              outputs[key] = lock
              (root / (key + '-digest.txt')).write_text(hashlib.sha256(Path(lock).read_bytes()).hexdigest() + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, path in outputs.items(): output.write(key + '=' + path + '\n')
          (root / 'candidate.json').write_text(json.dumps({'preview': preview, 'promoted': False, 'nativeWrites': False, 'qualification': 'candidate-only; see terminal source/browser/audit steps', 'locks': outputs}, indent=2))
          PYCODE
      - name: Install only integrity-locked candidate packages
        run: python -m pip install --require-hashes -r "$CI_LOCK" -r "$BROWSER_LOCK"
      - name: Install test-only Chromium
        run: python -m playwright install --with-deps chromium
      - name: Preserve full source and actual browser qualification
        run: |
          python -m ruff check --config reference/pyproject.toml reference tests/reference
          python -m mypy --config-file reference/pyproject.toml reference tests/reference
          python -m coverage run --branch --source=reference -m unittest discover -s tests/reference -v
          python -m coverage report --show-missing --fail-under=100
          python tests/scope_card/browser_smoke.py
          python tests/scope_card/form_browser_smoke.py
      - name: Audit both exact candidate graphs
        run: |
          python -m pip_audit --disable-pip --no-deps -r "$CI_LOCK"
          python -m pip_audit --disable-pip --no-deps -r "$BROWSER_LOCK"
      - name: Require regenerated baseline locks in the source commit
        if: github.event_name != 'schedule' && inputs.preview != true
        run: git diff --exit-code -- requirements-ci.lock tests/scope_card/browser-requirements.lock
      - name: Retain generated repair or preview candidates even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: decisions-test-dependency-candidate
          include-hidden-files: true
          path: |
            .local/test-locks/
            requirements-ci.lock
            tests/scope_card/browser-requirements.lock
          if-no-files-found: error
          retention-days: 30
