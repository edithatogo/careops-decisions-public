name: Credentialing governance contracts

on:
  pull_request:
    paths:
      - 'powerplatform/src/contracts/credentialing-*.json'
      - 'powerplatform/src/contracts/legacy-governance-reference*.json'
      - 'powerplatform/src/flows/credentialing-governance.contract.json'
      - 'tests/fixtures/credentialing/**'
      - 'docs/process/credentialing-governance-mvp.*'
      - 'scripts/Test-CredentialingContracts.ps1'
      - 'scripts/Test-CredentialingProcessModel.ps1'
      - '.github/workflows/credentialing-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'powerplatform/src/contracts/credentialing-*.json'
      - 'powerplatform/src/contracts/legacy-governance-reference*.json'
      - 'powerplatform/src/flows/credentialing-governance.contract.json'
      - 'tests/fixtures/credentialing/**'
      - 'docs/process/credentialing-governance-mvp.*'
      - 'scripts/Test-CredentialingContracts.ps1'
      - 'scripts/Test-CredentialingProcessModel.ps1'
      - '.github/workflows/credentialing-contracts.yml'

permissions:
  contents: read

concurrency:
  group: credentialing-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Synthetic human-decision and failure-path checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse all JSON and YAML scaffolds
        shell: pwsh
        run: ./scripts/Test-JsonYaml.ps1 -Strict
      - name: Validate credentialing governance contracts
        shell: pwsh
        run: ./scripts/Test-CredentialingContracts.ps1
      - name: Validate process models
        shell: pwsh
        run: ./scripts/Test-CredentialingProcessModel.ps1
