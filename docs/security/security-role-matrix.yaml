schema: decisions.workspace.security-role-matrix.v1
solution: DecisionsWorkspace
description: >
  Dataverse security role matrix for Decisions Workspace. Each role maps to
  table-level create, read, update, delete, append, and append-to privileges.
  Roles are design references, not yet implemented in Dataverse. Implement
  when deploying to shared test or production environments.

roles:
  - name: Administrator
    description: Full control over all tables, settings, and solution components.
    privilege: Full
    appliesTo: environment
    notes: >
      Limit to Power Platform admins. Not a day-to-day governance user.
      Only role that can modify solution components, export customizations,
      and manage environment-level settings.

  - name: Secretary
    description: Creates and manages meetings, agendas, papers, minutes, attendees, transcripts, and integration logs.
    privilege: Write
    appliesTo: user
    notes: >
      Primary operational role. Can create, edit, and delete records for
      assigned governance bodies. Cannot modify security roles, access rules,
      or AI prompt templates.

  - name: Chair
    description: Reviews and approves minutes, decisions, and actions. Views meeting records.
    privilege: Read + Approve
    appliesTo: user
    notes: >
      Can read all records for assigned bodies. Can approve minutes and
      decisions. Cannot create or edit meeting records (delegates to secretary).

  - name: Member
    description: Views meeting records and actions assigned to them. Creates action completion evidence.
    privilege: Read + OwnRecordWrite
    appliesTo: user
    notes: >
      Can read papers, minutes, decisions for bodies they belong to. Can
      write completion evidence on own actions. Cannot create meetings,
      edit minutes, or access restricted records without explicit access rule.

  - name: Author
    description: Submits papers and agenda items for assigned bodies.
    privilege: Write
    appliesTo: user
    notes: >
      Can create and edit papers and agenda items linked to bodies where
      they have author privileges. Cannot access minutes, decisions, or
      transcripts outside their authored items.

  - name: Restricted Reader
    description: Read-only access to a defined subset of records via access rules.
    privilege: Read
    appliesTo: user
    notes: >
      Explicitly scoped via dft_AccessRule. Cannot see any table data by
      default. Only records where a matching Allow rule exists. Used for
      external auditors, observers, and guest presenters with limited scope.

  - name: Auditor
    description: Read-only access to all records for audit and compliance review.
    privilege: Read
    appliesTo: user
    notes: >
      Can read all records including restricted and legal classifications.
      Cannot create, edit, delete, or approve any records. Audit-trail
      queries only.

  - name: Guest Presenter
    description: Limited-duration access to present at a specific meeting agenda item.
    privilege: Read
    appliesTo: user
    notes: >
      Time-boxed by meeting scope. Read access to the specific meeting,
      its agenda items, and their associated papers. No access to other
      meetings, minutes, decisions, or actions. Removed after meeting end
      date plus 30 days.

  - name: Service Account
    description: Automated flow and integration account for background sync operations.
    privilege: Write
    appliesTo: user
    notes: >
      Used by Power Automate flows for Planner sync, Outlook invite sync,
      Teams posts, Office 365 Users hierarchy sync, and AI Builder runs.
      Not a human login. Requires connection reference ownership in flows.

