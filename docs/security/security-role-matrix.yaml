accessTeamManagement:
  description: >
    Use Dataverse access teams (not owner teams) for committee membership-based
    access. When a person is added as a member of a governance body, an access
    team membership record grants them the Member role scoped to that body's
    meetings, decisions, and actions.
  notes:
    - Access teams auto-provision when a CommitteeMembership record is created with membershiprole=member and membershipstatus=active.
    - Owner teams are reserved for Secretary and Chair assignment per governance body.
    - Access exceptions are recorded in dft_AccessRule and must be manually mirrored in Dataverse role assignment or a custom sharing helper.

classificationModel:
  defaultField: dft_classification
  levels:
    - internal
    - confidential
    - restricted
    - legal
  sensitiveTables:
    - dft_AccessRule
    - dft_AIBuilderPrompt
    - dft_AIBuilderRun
    - dft_Attendee
    - dft_IntegrationLog
    - dft_Minutes
    - dft_Paper
    - dft_Transcript
  rules:
    - External participants default to restricted access until an explicit dft_AccessRule allows a narrower scope.
    - AI Builder prompts and outputs must not process restricted or legal content unless a future tenant-approved pattern explicitly permits it.
    - Transcript and paper access must follow the most restrictive classification among the meeting, source document, and access rule.

auditStrategy:
  auditTables:
    - dft_AccessRule
    - dft_AIBuilderRun
    - dft_Decision
    - dft_IntegrationLog
    - dft_Minutes
    - dft_Transcript
  events:
    - access rule creation or change
    - AI prompt run completion, failure, or skip
    - human review approval or rejection
    - minutes approval or publication
    - connector retry, failure, or stale external identifier
  evidence:
    - Dataverse audit history when enabled
    - dft_IntegrationLog rows for automated flows
    - release and deployment evidence bundles for ALM operations
