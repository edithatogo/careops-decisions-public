schemaVersion: 1
capabilityPack:
  id: credentialing-governance
  version: 0.1.0
  status: blueprint-disabled-by-default
  featureFlag: decisions_EnableCredentialingGovernance
  decisionAuthority: deployment-defined-human-delegate
  authoritativeDocuments: external-by-default
  rawSensitiveContentInTelemetry: false

entities:
  - name: CredentialingCase
    key: caseId
    fields:
      - caseId
      - sourceRequestId
      - practitionerReference
      - professionCode
      - pathwayCode
      - templateVersion
      - authorityMappingVersion
      - requestedScopeReferences
      - facilityOrServiceReferences
      - sourcePacketHash
      - status
      - receivedAt

  - name: EvidenceManifestReference
    key: evidenceManifestReferenceId
    fields:
      - evidenceManifestReferenceId
      - caseId
      - sourceSystem
      - sourceReference
      - manifestHash
      - verificationSummaryReference
      - classification
      - currentStatus

  - name: ProfessionalAssessment
    key: assessmentId
    fields:
      - assessmentId
      - caseId
      - assessmentType
      - reviewerReference
      - expertiseReference
      - sourceReferences
      - recommendationText
      - limitationsOrConditionsProposed
      - completedAt
      - humanConfirmed

  - name: ServiceCapabilityAttestation
    key: attestationId
    fields:
      - attestationId
      - caseId
      - facilityOrServiceReference
      - capabilityFrameworkReference
      - attestorReference
      - supportedScopeReferences
      - exclusions
      - conditions
      - effectiveAt
      - expiresAt
      - humanConfirmed

  - name: FairnessRecord
    key: fairnessRecordId
    fields:
      - fairnessRecordId
      - caseId
      - status
      - noticeReference
      - noticeIssuedAt
      - responseDueAt
      - responseReference
      - responseReceivedAt
      - consideredByReference
      - consideredAt

  - name: CommitteeConsideration
    key: considerationId
    fields:
      - considerationId
      - caseId
      - governanceBodyId
      - meetingId
      - termsOfReferenceVersion
      - quorumEvidenceReference
      - relevantPeerEvidenceReference
      - conflictRegisterReference
      - readinessStatus
      - consideredAt

  - name: Recommendation
    key: recommendationId
    fields:
      - recommendationId
      - considerationId
      - outcomeCode
      - recommendedScopeReferences
      - reasons
      - proposedConditions
      - proposedSupervisionReference
      - recommendedCommencementDate
      - recommendedExpiryDate
      - humanCommitteeConfirmed
      - confirmedByReference
      - confirmedAt
      - sourceMinutesReference
      - recordHash

  - name: DelegatedDecision
    key: decisionId
    fields:
      - decisionId
      - recommendationId
      - decisionMakerReference
      - delegationAuthorityReference
      - outcomeCode
      - approvedScopeReferences
      - reasons
      - conditionReferences
      - supervisionPlanReference
      - commencementDate
      - expiryDate
      - humanDecisionConfirmed
      - decidedAt
      - communicationReference
      - recordHash

  - name: Condition
    key: conditionId
    fields:
      - conditionId
      - decisionId
      - conditionType
      - description
      - ownerReference
      - effectiveFrom
      - reviewDueAt
      - expiresAt
      - status
      - completionEvidenceReference

  - name: SupervisionPlan
    key: supervisionPlanId
    fields:
      - supervisionPlanId
      - decisionId
      - supervisorReference
      - supervisionLevel
      - requirements
      - reviewDueAt
      - expiryDate
      - status

  - name: TemporaryApproval
    key: temporaryApprovalId
    fields:
      - temporaryApprovalId
      - caseId
      - pathwaySubtype
      - decisionId
      - authorityReference
      - minimumEvidenceReference
      - commencementDate
      - hardExpiryDate
      - retrospectiveReviewDueAt
      - conversionStatus

  - name: RegisterActivationReference
    key: activationId
    fields:
      - activationId
      - decisionId
      - authoritativeRegister
      - registerRecordReference
      - activationStatus
      - activatedAt
      - reconciledAt
      - reconciliationStatus

  - name: ReviewOrAppeal
    key: reviewOrAppealId
    fields:
      - reviewOrAppealId
      - decisionId
      - processType
      - groundsReference
      - lodgedAt
      - dueAt
      - governanceBodyReference
      - outcomeReference
      - outcomeAt
      - status

relationships:
  - from: CredentialingCase.caseId
    to: EvidenceManifestReference.caseId
    cardinality: one-to-many
  - from: CredentialingCase.caseId
    to: ProfessionalAssessment.caseId
    cardinality: one-to-many
  - from: CredentialingCase.caseId
    to: ServiceCapabilityAttestation.caseId
    cardinality: one-to-many
  - from: CredentialingCase.caseId
    to: FairnessRecord.caseId
    cardinality: one-to-many
  - from: CredentialingCase.caseId
    to: CommitteeConsideration.caseId
    cardinality: one-to-many
  - from: CommitteeConsideration.considerationId
    to: Recommendation.considerationId
    cardinality: one-to-many
  - from: Recommendation.recommendationId
    to: DelegatedDecision.recommendationId
    cardinality: one-to-many
  - from: DelegatedDecision.decisionId
    to: Condition.decisionId
    cardinality: one-to-many
  - from: DelegatedDecision.decisionId
    to: SupervisionPlan.decisionId
    cardinality: one-to-zero-or-one
  - from: DelegatedDecision.decisionId
    to: RegisterActivationReference.decisionId
    cardinality: one-to-zero-or-many
  - from: DelegatedDecision.decisionId
    to: ReviewOrAppeal.decisionId
    cardinality: one-to-many

invariants:
  - id: recommendation-is-not-decision
    rule: A Recommendation must never create or imply a DelegatedDecision.
  - id: human-recommendation-required
    rule: A recommendation cannot be final without humanCommitteeConfirmed, confirmedByReference, confirmedAt, reasons, and sourceMinutesReference.
  - id: human-decision-required
    rule: A decision cannot be final without humanDecisionConfirmed, decisionMakerReference, delegationAuthorityReference, decidedAt, outcomeCode, and reasons.
  - id: authority-fails-closed
    rule: Missing, stale, conflicting, or unapproved authority blocks consideration or decision and creates a visible exception.
  - id: packet-integrity
    rule: The source packet hash, template version, and authority mapping version are immutable after registration.
  - id: fairness-before-adverse-outcome
    rule: A potentially adverse recommendation or decision must satisfy the deployment-defined procedural-fairness gate.
  - id: temporary-hard-expiry
    rule: Temporary pathways require a subtype, current authority, hard expiry, and retrospective review date.
  - id: ai-draft-only
    rule: AI output may create draft text or exceptions only and cannot vote, recommend, decide, publish, or activate a register record.
  - id: release-separate
    rule: Register activation and release to practise are separate controls and require an approved decision reference and reconciliation evidence.
  - id: source-record-boundary
    rule: Raw credential, patient, investigation, complaint, or clinical records remain outside this capability pack unless explicitly approved by the deployment architecture.

statuses:
  CredentialingCase:
    - received
    - validation_exception
    - ready_for_professional_review
    - ready_for_committee
    - considered
    - recommendation_recorded
    - decision_recorded
    - communication_pending
    - completed
    - withdrawn
    - superseded
  Recommendation:
    - draft
    - pending_human_confirmation
    - confirmed
    - superseded
    - withdrawn
  DelegatedDecision:
    - draft
    - fairness_pending
    - pending_human_decision
    - decided
    - communicated
    - activated
    - suspended
    - revoked
    - expired
    - superseded
  ReviewOrAppeal:
    - lodged
    - information_requested
    - hearing_or_review_pending
    - decided
    - communicated
    - closed

security:
  minimumRoles:
    - governanceAdministrator
    - credentialingSecretariat
    - committeeChair
    - committeeMember
    - relevantPeer
    - delegatedDecisionMaker
    - readOnlyAuditor
  principles:
    - least-privilege
    - case-and-role-scoped-access
    - explicit-classification
    - immutable-decision-evidence
    - no-broad-channel-disclosure
    - no-sensitive-content-in-process-telemetry

integrationContracts:
  inbound: careops-approve-credentialing-governance-packet-0.1.0
  outboundDecision: careops-decisions-credentialing-result-0.1.0
  processEvents: careops-process-credentialing-events-0.1.0
