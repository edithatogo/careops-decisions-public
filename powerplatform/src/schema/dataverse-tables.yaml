publisherPrefix: dft
modelName: Decisions Workspace governance meeting system
schemaVersion: 0.1
compatibility:
  mvp: Dataverse for Teams compatible
  future: Full Dataverse with managed solution, roles, and environment variables
tables:
  - logicalName: dft_GovernanceBody
    displayName: Governance Body
    description: Board, council, committee, subcommittee, working group, project board, or recurring forum.
    purpose: Anchor for governance hierarchy, ownership, and reporting lines.
    mvpNotes:
      - Use one table for all governance forums in the MVP to keep the model simple.
      - Model the body type with a choice rather than separate tables.
    futureNotes:
      - Split into specialized subtypes only if reporting or security rules require it.
    primaryName:
      logicalName: dft_name
      label: Name
      type: text
      required: true
      maxLength: 200
    alternateKeys:
      - name: dft_governancebody_code
        columns: [dft_bodycode]
    columns:
      - logicalName: dft_bodycode
        label: Body Code
        type: text
        required: true
        maxLength: 50
        unique: true
      - logicalName: dft_bodytype
        label: Body Type
        type: choice
        choiceSet: governanceBodyType
        required: true
      - logicalName: dft_parentgovernancebodyid
        label: Parent Governance Body
        type: lookup
        relatedTable: dft_GovernanceBody
        required: false
      - logicalName: dft_ownerpersonid
        label: Owner Person
        type: lookup
        relatedTable: dft_OrgPerson
        required: false
      - logicalName: dft_status
        label: Status
        type: choice
        choiceSet: governanceBodyStatus
        required: true
      - logicalName: dft_description
        label: Description
        type: multilineText
        required: false
        maxLength: 2000
      - logicalName: dft_defaultclassification
        label: Default Classification
        type: choice
        choiceSet: recordClassification
        required: false

  - logicalName: dft_TermsOfReference
    displayName: Terms Of Reference
    description: Versioned mandate, quorum, membership rules, review cycle, and approval record.
    purpose: Store the current and historical authority for a governance body.
    mvpNotes:
      - Keep only one current record per governance body, but preserve previous versions.
      - Treat approval and review dates as plain columns, not workflow-enforced rules.
    futureNotes:
      - Add stronger approval workflows and document generation when the enterprise path is active.
    primaryName:
      logicalName: dft_name
      label: Title
      type: text
      required: true
      maxLength: 200
    alternateKeys:
      - name: dft_tor_version_key
        columns: [dft_governancebodyid, dft_versionnumber]
    columns:
      - logicalName: dft_governancebodyid
        label: Governance Body
        type: lookup
        relatedTable: dft_GovernanceBody
        required: true
      - logicalName: dft_versionnumber
        label: Version
        type: wholeNumber
        required: true
      - logicalName: dft_effectivefrom
        label: Effective From
        type: dateOnly
        required: true
      - logicalName: dft_effectiveto
        label: Effective To
        type: dateOnly
        required: false
      - logicalName: dft_reviewdueon
        label: Review Due On
        type: dateOnly
        required: false
      - logicalName: dft_status
        label: Status
        type: choice
        choiceSet: torStatus
        required: true
      - logicalName: dft_quorumnumber
        label: Quorum Number
        type: decimal
        required: false
      - logicalName: dft_quorumdenominator
        label: Quorum Denominator
        type: choice
        choiceSet: quorumDenominator
        required: false
      - logicalName: dft_approvalstatus
        label: Approval Status
        type: choice
        choiceSet: approvalStatus
        required: true
      - logicalName: dft_approvedon
        label: Approved On
        type: dateTime
        required: false

  - logicalName: dft_CommitteeMembership
    displayName: Committee Membership
    description: Person-to-governance-body membership, role, term, and voting rights.
    purpose: Keep an auditable record of who belongs to each governance body.
    mvpNotes:
      - Use this table for both formal membership and alternate/proxy roles.
      - Cache Office 365 Users data on the person table and join by stable IDs.
    futureNotes:
      - Sync membership from Entra groups or source HR systems when available.
    primaryName:
      logicalName: dft_name
      label: Membership
      type: text
      required: true
      maxLength: 200
    alternateKeys:
      - name: dft_membership_unique
        columns: [dft_governancebodyid, dft_orgpersonid, dft_startdate]
    columns:
      - logicalName: dft_governancebodyid
        label: Governance Body
        type: lookup
        relatedTable: dft_GovernanceBody
        required: true
      - logicalName: dft_orgpersonid
        label: Person
        type: lookup
        relatedTable: dft_OrgPerson
        required: true
      - logicalName: dft_membershiprole
        label: Membership Role
        type: choice
        choiceSet: membershipRole
        required: true
      - logicalName: dft_startdate
        label: Start Date
        type: dateOnly
        required: true
      - logicalName: dft_enddate
        label: End Date
        type: dateOnly
        required: false
      - logicalName: dft_membershipstatus
        label: Membership Status
        type: choice
        choiceSet: membershipStatus
        required: true
      - logicalName: dft_votingrights
        label: Voting Rights
        type: yesNo
        required: true
      - logicalName: dft_isalternate
        label: Is Alternate
        type: yesNo
        required: true

  - logicalName: dft_OrgPerson
    displayName: Org Person
    description: Cached identity record from Office 365 Users or later Graph sync.
    purpose: Stable person cache for joins, ownership, and reporting.
    mvpNotes:
      - Store the fields returned by the Office 365 Users connector so the app can work without Graph.
      - Do not join on display name.
    futureNotes:
      - Refresh the cache from Entra IDs and Graph when enterprise sync is enabled.
    primaryName:
      logicalName: dft_name
      label: Display Name
      type: text
      required: true
      maxLength: 200
    alternateKeys:
      - name: dft_orgperson_objectid
        columns: [dft_aadobjectid]
      - name: dft_orgperson_workmail
        columns: [dft_workemail]
    columns:
      - logicalName: dft_aadobjectid
        label: Entra Object ID
        type: text
        required: false
        maxLength: 100
        unique: true
      - logicalName: dft_workemail
        label: Work Email
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_userprincipalname
        label: User Principal Name
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_jobtitle
        label: Job Title
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_department
        label: Department
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_manageremail
        label: Manager Email
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_lastsyncedon
        label: Last Synced On
        type: dateTime
        required: false

  - logicalName: dft_OrgRelationship
    displayName: Org Relationship
    description: Reporting, manager, delegate, and other organization relationships.
    purpose: Preserve hierarchy hints separately from governance membership.
    mvpNotes:
      - Use this as a cache of org relationships from Office 365 Users.
    futureNotes:
      - Replace or augment with Graph or HR-system sync when available.
    primaryName:
      logicalName: dft_name
      label: Relationship
      type: text
      required: true
      maxLength: 200
    alternateKeys:
      - name: dft_orgrelationship_unique
        columns: [dft_sourcepersonid, dft_targetpersonid, dft_relationshiptype]
    columns:
      - logicalName: dft_sourcepersonid
        label: Source Person
        type: lookup
        relatedTable: dft_OrgPerson
        required: true
      - logicalName: dft_targetpersonid
        label: Target Person
        type: lookup
        relatedTable: dft_OrgPerson
        required: true
      - logicalName: dft_relationshiptype
        label: Relationship Type
        type: choice
        choiceSet: orgRelationshipType
        required: true
      - logicalName: dft_effectivefrom
        label: Effective From
        type: dateOnly
        required: false
      - logicalName: dft_effectiveto
        label: Effective To
        type: dateOnly
        required: false
      - logicalName: dft_source
        label: Source
        type: choice
        choiceSet: identitySource
        required: true

  - logicalName: dft_FeatureDefinition
    displayName: Feature Definition
    description: Canonical capability switch that can be resolved at environment, governance body, series, or meeting level.
    purpose: Hold the environment default for each switchable meeting capability.
    mvpNotes:
      - Keep one row per capability switch so the app can resolve voting, AI minutes, transcript import, Planner sync, Teams posts, SharePoint papers and minutes, Outlook invites, and org hierarchy without hard-coded flags.
      - Treat the default state on this table as the environment baseline before any contextual template or meeting override is applied.
    futureNotes:
      - Add admin management screens only when the switchboard needs non-technical maintenance.
    primaryName:
      logicalName: dft_name
      label: Feature
      type: text
      required: true
      maxLength: 200
    columns:
      - logicalName: dft_featurekey
        label: Feature Key
        type: choice
        choiceSet: featureKey
        required: true
      - logicalName: dft_defaultstate
        label: Default State
        type: choice
        choiceSet: featureSwitchState
        required: true
      - logicalName: dft_description
        label: Description
        type: multilineText
        required: false
        maxLength: 4000
      - logicalName: dft_sortorder
        label: Sort Order
        type: wholeNumber
        required: false

  - logicalName: dft_MeetingSeries
    displayName: Meeting Series
    description: Recurring meeting pattern and default operating context.
    purpose: Define the cadence, owner, and defaults for a set of meetings.
    mvpNotes:
      - Keep recurrence simple and store the pattern as a choice plus free-text rule.
    futureNotes:
      - Add richer recurrence expression handling if a single choice is not enough.
    primaryName:
      logicalName: dft_name
      label: Series Name
      type: text
      required: true
      maxLength: 200
    alternateKeys:
      - name: dft_meetingseries_code
        columns: [dft_seriescode]
    columns:
      - logicalName: dft_seriescode
        label: Series Code
        type: text
        required: true
        maxLength: 50
        unique: true
      - logicalName: dft_governancebodyid
        label: Governance Body
        type: lookup
        relatedTable: dft_GovernanceBody
        required: true
      - logicalName: dft_seriesownerid
        label: Series Owner
        type: lookup
        relatedTable: dft_OrgPerson
        required: false
      - logicalName: dft_meetingcadence
        label: Meeting Cadence
        type: choice
        choiceSet: recurrencePattern
        required: true
      - logicalName: dft_recurrencerule
        label: Recurrence Rule
        type: text
        required: false
        maxLength: 500
      - logicalName: dft_defaultlocation
        label: Default Location
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_defaultchannelid
        label: Default Channel Id
        type: text
        required: false
        maxLength: 100
      - logicalName: dft_defaultteamid
        label: Default Team Id
        type: text
        required: false
        maxLength: 100
      - logicalName: dft_seriesstatus
        label: Series Status
        type: choice
        choiceSet: seriesStatus
        required: true

  - logicalName: dft_FeatureTemplate
    displayName: Feature Template
    description: Context-specific feature default that sits between the feature definition and a per-meeting override.
    purpose: Store template rows for governance body, meeting series, or named default contexts.
    mvpNotes:
      - Allow a blank-context row to act as the environment template when no governance body or meeting series is supplied.
      - Resolve the nearest matching row in this order: meeting override, meeting series template, governance body template, then feature definition default.
    futureNotes:
      - Add template-copy tooling only if administrators need reusable bundles of switch settings.
    primaryName:
      logicalName: dft_name
      label: Template Name
      type: text
      required: true
      maxLength: 200
    columns:
      - logicalName: dft_templatecode
        label: Template Code
        type: text
        required: false
        maxLength: 100
      - logicalName: dft_featuredefinitionid
        label: Feature Definition
        type: lookup
        relatedTable: dft_FeatureDefinition
        required: true
      - logicalName: dft_governancebodyid
        label: Governance Body
        type: lookup
        relatedTable: dft_GovernanceBody
        required: false
      - logicalName: dft_meetingseriesid
        label: Meeting Series
        type: lookup
        relatedTable: dft_MeetingSeries
        required: false
      - logicalName: dft_state
        label: State
        type: choice
        choiceSet: featureSwitchState
        required: true
      - logicalName: dft_notes
        label: Notes
        type: multilineText
        required: false
        maxLength: 4000

  - logicalName: dft_Meeting
    displayName: Meeting
    description: Individual meeting instance with agenda, invite, minutes, decisions, actions, and sync metadata.
    purpose: Authoritative record for one meeting occurrence.
    mvpNotes:
      - Keep the meeting row authoritative even when Outlook, Teams, or SharePoint hold copies.
      - Store external IDs on the meeting record so flows can be idempotent.
    futureNotes:
      - Extend with richer Graph meeting metadata and attendance data when available.
    primaryName:
      logicalName: dft_name
      label: Meeting Title
      type: text
      required: true
      maxLength: 200
    alternateKeys:
      - name: dft_meeting_external_event
        columns: [dft_externalcalendarid]
    columns:
      - logicalName: dft_meetingseriesid
        label: Meeting Series
        type: lookup
        relatedTable: dft_MeetingSeries
        required: true
      - logicalName: dft_subject
        label: Subject
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_meetingnumber
        label: Meeting Number
        type: wholeNumber
        required: false
      - logicalName: dft_startdatetime
        label: Start Date Time
        type: dateTime
        required: true
      - logicalName: dft_enddatetime
        label: End Date Time
        type: dateTime
        required: false
      - logicalName: dft_scheduledstartutc
        label: Scheduled Start UTC
        type: dateTime
        required: true
      - logicalName: dft_scheduledendutc
        label: Scheduled End UTC
        type: dateTime
        required: false
      - logicalName: dft_actualstartutc
        label: Actual Start UTC
        type: dateTime
        required: false
      - logicalName: dft_actualendutc
        label: Actual End UTC
        type: dateTime
        required: false
      - logicalName: dft_meetingstatus
        label: Status
        type: choice
        choiceSet: meetingStatus
        required: true
      - logicalName: dft_externalcalendarid
        label: External Calendar Id
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_outlookeventid
        label: Outlook Event Id
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_externalteamsid
        label: External Teams Meeting Id
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_teamsjoinurl
        label: Teams Join Url
        type: text
        required: false
        maxLength: 500
      - logicalName: dft_location
        label: Location
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_chairpersonid
        label: Chair Person
        type: lookup
        relatedTable: dft_OrgPerson
        required: false
      - logicalName: dft_inviterequested
        label: Invite Requested
        type: yesNo
        required: true
      - logicalName: dft_invitesyncstate
        label: Invite Sync State
        type: choice
        choiceSet: integrationStatus
        required: true
      - logicalName: dft_invitesynchash
        label: Invite Sync Hash
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_invitesyncedon
        label: Invite Synced On
        type: dateTime
        required: false
      - logicalName: dft_requiredattendees
        label: Required Attendees
        type: multilineText
        required: false
        maxLength: 4000
      - logicalName: dft_optionalattendees
        label: Optional Attendees
        type: multilineText
        required: false
        maxLength: 4000
      - logicalName: dft_teamsmessageid
        label: Teams Message Id
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_teamspostkey
        label: Teams Post Key
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_teamspostedon
        label: Teams Posted On
        type: dateTime
        required: false
      - logicalName: dft_classification
        label: Classification
        type: choice
        choiceSet: recordClassification
        required: true

  - logicalName: dft_MeetingFeatureOverride
    displayName: Meeting Feature Override
    description: Per-meeting feature state that overrides the resolved feature template or definition default.
    purpose: Store the final meeting-level decision for switchable capabilities.
    mvpNotes:
      - Leave a feature out of this table when the meeting should inherit the series, governance body, or definition default.
      - Use this table only for explicit meeting-level exceptions so the app can resolve a clean switchboard.
    futureNotes:
      - Add audit or approval metadata only if business rules need a trace of who changed the final meeting state.
    primaryName:
      logicalName: dft_name
      label: Override Name
      type: text
      required: true
      maxLength: 200
    alternateKeys:
      - name: dft_meetingfeatureoverride_unique
        columns: [dft_meetingid, dft_featuredefinitionid]
    columns:
      - logicalName: dft_meetingid
        label: Meeting
        type: lookup
        relatedTable: dft_Meeting
        required: true
      - logicalName: dft_featuredefinitionid
        label: Feature Definition
        type: lookup
        relatedTable: dft_FeatureDefinition
        required: true
      - logicalName: dft_state
        label: State
        type: choice
        choiceSet: featureSwitchState
        required: true
      - logicalName: dft_reason
        label: Reason
        type: multilineText
        required: false
        maxLength: 4000

  - logicalName: dft_Attendee
    displayName: Attendee
    description: Expected or actual meeting attendee record with response and attendance status.
    purpose: Track invitees, proxies, and actual attendance per meeting.
    mvpNotes:
      - Keep attendee state separate from membership because a person can attend without being a member.
    futureNotes:
      - Expand with attendance reports or automatic sync from Graph when available.
    primaryName:
      logicalName: dft_name
      label: Attendee
      type: text
      required: true
      maxLength: 200
    alternateKeys:
      - name: dft_attendee_unique
        columns: [dft_meetingid, dft_orgpersonid]
    columns:
      - logicalName: dft_meetingid
        label: Meeting
        type: lookup
        relatedTable: dft_Meeting
        required: true
      - logicalName: dft_orgpersonid
        label: Person
        type: lookup
        relatedTable: dft_OrgPerson
        required: false
      - logicalName: dft_displayname
        label: Display Name
        type: text
        required: true
        maxLength: 200
      - logicalName: dft_emailaddress
        label: Email Address
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_response
        label: Response
        type: choice
        choiceSet: attendanceResponse
        required: false
      - logicalName: dft_attendancestatus
        label: Attendance Status
        type: choice
        choiceSet: attendanceStatus
        required: true
      - logicalName: dft_attendeerole
        label: Attendee Role
        type: choice
        choiceSet: attendeeRole
        required: true
      - logicalName: dft_isproxy
        label: Is Proxy
        type: yesNo
        required: true
      - logicalName: dft_votingeligible
        label: Voting Eligible
        type: yesNo
        required: true
      - logicalName: dft_invitedon
        label: Invited On
        type: dateTime
        required: false
      - logicalName: dft_responseupdatedon
        label: Response Updated On
        type: dateTime
        required: false
      - logicalName: dft_outlookattendeeid
        label: Outlook Attendee Id
        type: text
        required: false
        maxLength: 200

  - logicalName: dft_AgendaItem
    displayName: Agenda Item
    description: Ordered meeting agenda item with presenter, purpose, and outcome tracking.
    purpose: Break a meeting into trackable agenda items and decisions.
    mvpNotes:
      - Keep the agenda item record lightweight and store detailed notes in minutes.
    futureNotes:
      - Add agenda templates and agenda item reuse if the product needs repeatable patterns.
    primaryName:
      logicalName: dft_name
      label: Agenda Item
      type: text
      required: true
      maxLength: 200
    alternateKeys:
      - name: dft_agendaitem_sequence
        columns: [dft_meetingid, dft_sequence]
    columns:
      - logicalName: dft_meetingid
        label: Meeting
        type: lookup
        relatedTable: dft_Meeting
        required: true
      - logicalName: dft_sequence
        label: Sequence
        type: wholeNumber
        required: true
      - logicalName: dft_agendatitle
        label: Title
        type: text
        required: true
        maxLength: 200
      - logicalName: dft_purpose
        label: Purpose
        type: choice
        choiceSet: agendaPurpose
        required: true
      - logicalName: dft_presenterid
        label: Presenter
        type: lookup
        relatedTable: dft_OrgPerson
        required: false
      - logicalName: dft_timeminutes
        label: Time Minutes
        type: wholeNumber
        required: false
      - logicalName: dft_minutetext
        label: Minute Text
        type: multilineText
        required: false
        maxLength: 4000
      - logicalName: dft_decisionsought
        label: Decision Sought
        type: yesNo
        required: true
      - logicalName: dft_status
        label: Status
        type: choice
        choiceSet: agendaItemStatus
        required: true

  - logicalName: dft_Paper
    displayName: Paper
    description: Registered meeting paper, attachment, or linked document.
    purpose: Capture pre-read and meeting papers with classification and source metadata.
    mvpNotes:
      - Use a SharePoint link first; store file content in Dataverse only when needed.
    futureNotes:
      - Add richer document governance and retention metadata when enterprise controls are available.
    primaryName:
      logicalName: dft_name
      label: Paper Title
      type: text
      required: true
      maxLength: 200
    alternateKeys:
      - name: dft_paper_source
        columns: [dft_documentid]
    columns:
      - logicalName: dft_meetingid
        label: Meeting
        type: lookup
        relatedTable: dft_Meeting
        required: true
      - logicalName: dft_agendaitemid
        label: Agenda Item
        type: lookup
        relatedTable: dft_AgendaItem
        required: false
      - logicalName: dft_documentid
        label: External Document Id
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_documentsource
        label: Document Source
        type: choice
        choiceSet: paperSource
        required: true
      - logicalName: dft_classification
        label: Classification
        type: choice
        choiceSet: recordClassification
        required: true
      - logicalName: dft_paperstatus
        label: Status
        type: choice
        choiceSet: paperStatus
        required: true
      - logicalName: dft_ownerid
        label: Owner
        type: lookup
        relatedTable: dft_OrgPerson
        required: false
      - logicalName: dft_sharepointurl
        label: SharePoint Url
        type: text
        required: false
        maxLength: 500
      - logicalName: dft_sharepointsiteid
        label: SharePoint Site Id
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_sharepointdriveid
        label: SharePoint Drive Id
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_sharepointitemid
        label: SharePoint Item Id
        type: text
        required: false
        maxLength: 200

  - logicalName: dft_Minutes
    displayName: Minutes
    description: Draft, reviewed, approved, or published meeting minutes.
    purpose: Store the official meeting record and final published text.
    mvpNotes:
      - Keep draft text in Dataverse so the app can review and approve it without extra dependencies.
    futureNotes:
      - Generate minutes from transcript and AI Builder outputs, but keep human approval mandatory.
    primaryName:
      logicalName: dft_name
      label: Minutes Title
      type: text
      required: true
      maxLength: 200
    alternateKeys:
      - name: dft_minutes_meeting_version
        columns: [dft_meetingid, dft_versionnumber]
    columns:
      - logicalName: dft_meetingid
        label: Meeting
        type: lookup
        relatedTable: dft_Meeting
        required: true
      - logicalName: dft_versionnumber
        label: Version
        type: wholeNumber
        required: true
      - logicalName: dft_status
        label: Status
        type: choice
        choiceSet: minuteStatus
        required: true
      - logicalName: dft_drafttext
        label: Draft Text
        type: multilineText
        required: false
        maxLength: 32000
      - logicalName: dft_approvedbyid
        label: Approved By
        type: lookup
        relatedTable: dft_OrgPerson
        required: false
      - logicalName: dft_approvedon
        label: Approved On
        type: dateTime
        required: false
      - logicalName: dft_publishedon
        label: Published On
        type: dateTime
        required: false
      - logicalName: dft_publishedurl
        label: Published Url
        type: text
        required: false
        maxLength: 500
      - logicalName: dft_sharepointsiteid
        label: SharePoint Site Id
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_sharepointdriveid
        label: SharePoint Drive Id
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_sharepointitemid
        label: SharePoint Item Id
        type: text
        required: false
        maxLength: 200
      - logicalName: dft_classification
        label: Classification
        type: choice
        choiceSet: recordClassification
        required: true

  - logicalName: dft_Transcript
    displayName: Transcript
    description: Imported or retrieved meeting transcript and processing state.
    purpose: Preserve transcript text or references for downstream minute drafting and audit.
    mvpNotes:
      - Allow a manual paste/import path before Graph transcript automation exists.
