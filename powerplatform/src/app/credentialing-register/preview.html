<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Synthetic credentialing register preview</title>
  <link rel="stylesheet" href="scope-card.css">
  <script src="scope-card.js" defer></script>
  <script src="preview.js" defer></script>
</head>
<body>
  <main>
    <p class="synthetic">SYNTHETIC PREVIEW. Not a practitioner record or approval to practise.</p>
    <header><h1>Credentialing register</h1><button id="scope-refresh" type="button" disabled>Refresh snapshot</button></header>
    <label for="scenario">Synthetic scenario</label>
    <select id="scenario">
      <option value="recorded">Recorded scope with conditions</option>
      <option value="revoked">Recorded revocation with stale source check</option>
      <option value="expired">Expired recorded grant</option>
      <option value="missing">Missing conditions: reject the response</option>
    </select>
    <section id="scope-card" aria-live="polite" aria-atomic="true"><p>Loading synthetic scenario.</p></section>
  </main>
</body>
</html>
